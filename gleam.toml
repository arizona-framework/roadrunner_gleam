name = "roadrunner_gleam"
version = "0.1.0"
description = "Run Gleam web apps on Roadrunner, the pure-Erlang HTTP/1.1, HTTP/2, HTTP/3 and WebSocket server"
licences = ["Apache-2.0"]
repository = { type = "github", user = "arizona-framework", repo = "roadrunner_gleam" }
links = [
  { title = "Roadrunner", href = "https://github.com/arizona-framework/roadrunner" },
]
gleam = ">= 1.19.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
roadrunner = ">= 0.15.0 and < 0.16.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
